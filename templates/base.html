{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}YaMovies{% endblock %}</title>
	<link rel="stylesheet" href="{% static 'css/global.css' %}">
	{% block extra_css %}{% endblock %}
</head>
<body>
	<header class="site-header">
		<div class="container nav-wrapper">
			<a href="{% url 'home' %}" class="nav-link">YaMovies</a>
			<nav class="nav-links">
				<a href="{% url 'catalog' %}" class="nav-link">Каталог</a>
				{% if user.is_authenticated %}
					<a href="{% url 'profile' %}" class="nav-link">Профиль ({{ user.username }})</a>
					<form action="{% url 'logout' %}" method="post" class="logout-form">
						{% csrf-token %}
						<button type="submit" class="btn-logout">Выйти</button>
					</form>
				{% else %}
					<a href="{% url 'login' %}" class="nav-link">Вход</a>
					<a href="{% url 'register' %}" class="btn">Регистрация</a>
				{% endif %}
			</nav>
		</div>
	</header>

	<main class="container main-content">
		{% block content %}
		{% endblock %}
	</main>
</body>
</html>
